[package]
name = "matrix-mcp"
version = "0.2.3"
edition = "2021"
description = "A Model Context Protocol (MCP) server for the Matrix chat protocol, built on the official Rust SDKs (rmcp + matrix-sdk)."
license = "MIT"
readme = "README.md"
repository = "https://github.com/qechris/matrix-mcp"
keywords = ["matrix", "mcp", "model-context-protocol", "chat", "llm"]
categories = ["command-line-utilities"]

[dependencies]
# Official MCP Rust SDK: server runtime + stdio and streamable-HTTP/SSE
# transports + #[tool] macros.
rmcp = { version = "3.1", features = [
    "server",
    "transport-io",
    "transport-streamable-http-server",
    "macros",
] }
# HTTP server for the SSE-based streamable-HTTP transport (matches the axum
# version rmcp builds against).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
# Official Matrix Rust SDK. rustls (aws-lc-rs backend) for TLS, markdown for formatted messages,
# end-to-end encryption with automatic room-key forwarding, and a bundled
# SQLite store so crypto keys and room state persist across restarts.
matrix-sdk = { version = "=0.19.1", default-features = false, features = [
    "rustls-aws-lc-rs",
    "markdown",
    "e2e-encryption",
    "automatic-room-key-forwarding",
    "bundled-sqlite",
    "sso-login",
] }
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "fs",
    "io-std",
    "sync",
    "time",
    "net",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
# MIME type detection for the `send_file` tool. `mime_guess::Mime` is
# `mime::Mime` under the hood, but we never name the type ourselves, so it
# flows through by inference without `mime` needing to be a direct dependency.
mime_guess = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Opens the SSO login URL in the user's default browser for the `login_sso`
# tool. Best-effort: if it fails (e.g. no display, headless/Docker), the URL
# is still returned to the caller to open manually.
webbrowser = "1"

[profile.release]
strip = true
